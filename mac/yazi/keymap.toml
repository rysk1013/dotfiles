[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Workspace/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = 'cd "~/pCloud Drive"'
desc = "Go to pCloud Drive"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/Workspace"
desc = "Go to Workspace"

[[mgr.prepend_keymap]]
on = "!"
run = 'shell "$SHELL" --block'
desc = "Open shell here"
