# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal / input
set -s default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -as terminal-features ",xterm-ghostty:RGB:clipboard"
set -s extended-keys on
set -s set-clipboard external
set -s escape-time 10
set -g focus-events on

# General behavior
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
set -g display-panes-time 1500
set -g set-titles on
set -g set-titles-string "tmux: #S / #W"
setw -g mode-keys vi
set -g status-keys vi
set -g visual-bell off
set -g bell-action none

# Reload
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Windows and panes inherit the current working directory
bind c new-window -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind r split-window -h -c "#{pane_current_path}"
bind D detach-client

# Pane navigation and zoom (same layout as WezTerm / Ghostty)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z

# Enter a resize key table with Prefix + s; Enter/Escape exits
bind s switch-client -T resize-pane
bind -T resize-pane -r h resize-pane -L 2
bind -T resize-pane -r j resize-pane -D 1
bind -T resize-pane -r k resize-pane -U 1
bind -T resize-pane -r l resize-pane -R 2
bind -T resize-pane Enter switch-client -T root
bind -T resize-pane Escape switch-client -T root
bind -T resize-pane q switch-client -T root

# Vi-style copy mode; y also updates the outer terminal clipboard via OSC 52
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Tokyo Night-inspired, intentionally compact status line
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-right "#[fg=#7dcfff]#{pane_current_path} #[fg=#565f89]| #[fg=#c0caf5]%m/%d %H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#dfff00,fg=#202020,bold] #I:#W #[default]"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#e0af68,fg=#1a1b26"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
